[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# Ruleset volontairement resserré (pas de refonte de style) : erreurs
# Pyflakes/pycodestyle réelles (imports/variables inutilisés, bugs évidents)
# plutôt qu'un reformatage massif d'un code jamais linté jusqu'ici.
select = ["E4", "E7", "E9", "F"]
