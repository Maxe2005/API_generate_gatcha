name: CI

on:
  push:
    branches: [development, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances (runtime + dev)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # Uniquement les tests unitaires purs : aucune base de données, Redis,
      # MinIO ou service externe n'est disponible sur ce runner (voir
      # CLAUDE.md — le reste de la suite nécessite la stack docker complète).
      - name: Tests unitaires
        run: >
          python -m pytest
          tests/test_validation_service.py
          tests/test_update_events.py
          tests/test_security.py
          tests/test_state_manager.py
          -v
